syntax = "proto3";

package robocup;

service Simulator {
    // Client subscribes to sensor stream from simulator
    rpc SensorStream(SensorRequest) returns (stream SensorData);

    // Client sends control commands to simulator
    rpc SendCommand(stream RobotCommand) returns (CommandResponse);
}

message SensorRequest {
    int32 robot_id = 1;
}

message SensorData {
    int32 robot_id = 1;

    // Camera image (raw RGB bytes)
    int32 image_width = 2;
    int32 image_height = 3;
    bytes image_data = 4;

    // Position (meters)
    float pos_x = 5;
    float pos_y = 6;
    float pos_z = 7;

    // Orientation (radians)
    float yaw = 8;

    // Wheel velocities
    float velocity = 9;
    float angular_velocity = 10;

    // Timestamp
    double timestamp = 11;

    // Dead-reckoning odometry estimate (drifts under slip)
    float odom_x = 12;
    float odom_z = 13;
    float odom_yaw = 14;
}

message RobotCommand {
    int32 robot_id = 1;

    // Body-frame velocity command (vx forward, vy lateral, omega yaw rate)
    float vx = 2;
    float vy = 3;
    float omega = 4;

    // Kicker
    float kick_power = 5;    // 0.0 to 1.0

    // Dribbler
    float dribble_speed = 6; // -1.0 to 1.0

    double timestamp = 7;
}

message CommandResponse {
    bool success = 1;
    string message = 2;
}
