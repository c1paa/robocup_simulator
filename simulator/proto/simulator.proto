syntax = "proto3";

package robocup;

service Simulator {
    // Client subscribes to sensor stream from simulator
    rpc SensorStream(SensorRequest) returns (stream SensorData);

    // Client sends control commands to simulator
    rpc SendCommand(stream RobotCommand) returns (CommandResponse);

    // Adds a new robot to the field at runtime and returns its robot_id --
    // the gRPC-callable equivalent of App::addRobot on the C++ side (see
    // docs/tasks/multi-robot.md's "Dynamic robot creation" section). Unary:
    // blocks until the robot is actually constructed and registered (Bullet
    // rigid body + its own camera FBOs, done on the simulator's own main
    // thread -- see SimulatorServiceImpl::AddRobot), so a SensorStream/
    // SendCommand call using the returned robot_id right after this returns
    // is guaranteed to find it.
    rpc AddRobot(AddRobotRequest) returns (AddRobotResponse);

    // Liveness/readiness probe; succeeds once the gRPC server is serving.
    rpc Ping(PingRequest) returns (PingResponse);

    // Match mode: claims a named slot from the simulator's --match config,
    // creating that slot's robot (team, spawn, robot config) and returning
    // its robot_id plus a secret token. SendCommand/SensorStream for a
    // Join()ed robot require that token (gRPC metadata "x-robot-token"), so
    // one program cannot drive another's robot. Re-joining a claimed slot is
    // allowed only with the token from the original Join (reconnect).
    rpc Join(JoinRequest) returns (JoinResponse);

    // Lists the match slots and whether each one is claimed.
    rpc ListRobots(ListRobotsRequest) returns (ListRobotsResponse);

    // Asks the simulator to close its window and exit.
    rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
}

message JoinRequest {
    string slot = 1;
    string token = 2; // only to reconnect to a slot you already own
}
message JoinResponse {
    bool success = 1;
    string message = 2;
    int32 robot_id = 3;
    string token = 4;
    string team = 5;
}
message ListRobotsRequest {}
message SlotInfo {
    string slot = 1;
    string team = 2;
    bool claimed = 3;
    int32 robot_id = 4; // valid only if claimed
}
message ListRobotsResponse {
    repeated SlotInfo slots = 1;
}

message PingRequest {}
message PingResponse { int32 robot_count = 1; }
message ShutdownRequest {}
message ShutdownResponse {}

message SensorRequest {
    int32 robot_id = 1;
}

message AddRobotRequest {
    // Path to the robot's config JSON, resolved on the machine running the
    // simulator (server-side filesystem), relative to the simulator
    // process's own working directory -- same convention as main.cpp's
    // --robot CLI flag, NOT relative to the calling client.
    string config_path = 1;

    // Spawn pose override (mm / degrees). All-zero (the default) means "use
    // config_path's own /robot/spawn/* (default: origin)" -- see
    // Config::setRobotSpawn's doc comment for why zero can't be
    // distinguished from "explicitly place at the origin" (same limitation
    // App::addRobot already has in C++).
    float spawn_x = 2;
    float spawn_z = 3;
    float spawn_yaw_deg = 4;
}

message AddRobotResponse {
    bool success = 1;
    string message = 2;
    int32 robot_id = 3; // valid only if success
}

message SensorData {
    int32 robot_id = 1;

    // Camera image (raw RGB bytes)
    int32 image_width = 2;
    int32 image_height = 3;
    bytes image_data = 4;

    // Position (meters)
    float pos_x = 5;
    float pos_y = 6;
    float pos_z = 7;

    // Orientation (radians)
    float yaw = 8;

    // Wheel velocities
    float velocity = 9;
    float angular_velocity = 10;

    // Timestamp
    double timestamp = 11;

    // Dead-reckoning odometry estimate (drifts under slip)
    float odom_x = 12;
    float odom_z = 13;
    float odom_yaw = 14;

    // Latest completed lidar scan (robot body frame)
    repeated LidarPoint lidar_points = 15;

    // Ball ground-truth position (meters)
    float ball_pos_x = 16;
    float ball_pos_y = 17;
    float ball_pos_z = 18;

    // Dribbler motor's actual (lagged, load-sagged) speed, RPM, signed the same
    // as dribble_speed (positive = capture direction).
    float dribbler_rpm = 19;

    // Kicker capacitor charge level, 0.0 (empty) to 1.0 (full) --
    // capacitor_voltage / /robot/capacitor/charge_voltage. See
    // docs/tasks/dribbler-kicker.md's "Electrical rewrite" section for the
    // full circuit model behind these three fields.
    float capacitor_charge = 20;

    // Actual robot bus voltage (V), sagged from /robot/battery/working_voltage
    // by whatever current the capacitor charging path (and, during a
    // charge+fire short circuit, the kicker coil) is currently drawing.
    float bus_voltage = 21;

    // Actual kicker capacitor voltage (V), 0 (empty) to
    // /robot/capacitor/charge_voltage (full).
    float capacitor_voltage = 22;

    // BNO055-modeled IMU. Fused absolute orientation (roll/pitch/yaw, radians)
    // -- NOT raw gyro integration, so yaw does not accumulate drift the way a
    // pure gyroscope would (magnetometer-anchored heading, per the real
    // sensor's NDOF fusion mode); small per-sample noise only. The robot's
    // own chassis never tips (see Robot's yaw-only angular factor), so
    // imu_roll/imu_pitch are always ~0 + noise, matching what the real sensor
    // would read mounted flat on a robot that never leaves the ground.
    float imu_roll = 23;
    float imu_pitch = 24;
    float imu_yaw = 25;

    // Linear acceleration, body frame (m/s^2), gravity already removed --
    // matches the real BNO055's VECTOR_LINEARACCEL output, not raw
    // accelerometer/proper-acceleration. See docs/tasks/imu-sensor.md.
    float imu_accel_x = 26; // body +X (forward)
    float imu_accel_y = 27; // body +Y (up)
    float imu_accel_z = 28; // body +Z (lateral)

    // Angular velocity, body frame (rad/s) -- matches VECTOR_GYROSCOPE.
    float imu_gyro_x = 29;
    float imu_gyro_y = 30; // yaw rate; matches angular_velocity above (noisy)
    float imu_gyro_z = 31;
}

message LidarPoint {
    float angle = 1;     // radians, robot body frame, 0 = forward (+X); positive = left
                          // (same rotation sense as omega/yaw)
    float distance = 2;  // meters
    float intensity = 3; // 0.0-1.0, synthetic confidence value
}

message RobotCommand {
    int32 robot_id = 1;

    // Body-frame velocity command (vx forward, vy lateral, omega yaw rate)
    float vx = 2;
    float vy = 3;
    float omega = 4;

    // Removed: the old one-shot kick_power=[0,1] request model. Superseded by
    // capacitor_charge_open/kicker_open below -- see docs/tasks/
    // dribbler-kicker.md's "Electrical rewrite" section. Field number kept
    // reserved rather than reused (proto3 hygiene: an old client sending this
    // field to a new server is simply ignored, not misinterpreted).
    reserved 5;
    reserved "kick_power";

    // Dribbler: roller speed command in [-1.0, 1.0]. Positive = capture
    // direction (the roller surface at the ball contact point moves toward the
    // robot, i.e. local -X, pulling a ball in and holding it); negative =
    // eject direction. Magnitude scales to /robot/dribbler/max_speed RPM.
    float dribble_speed = 6;

    double timestamp = 7;

    // Kicker power switches -- both are persistent state (like dribble_speed
    // above), held open/closed for exactly as long as the client wants, same
    // as the real hardware's two independent MOSFET gates:
    //  - capacitor_charge_open: charging path closed (boost converter ->
    //    charge_resistance -> capacitor). Client controls charge duration
    //    itself by calling open_capacitor()/close_capacitor() (SimRobotHAL).
    //  - kicker_open: discharge path closed (capacitor -> solenoid coil).
    //    Client controls fire duration itself via open_kicker()/close_kicker().
    // Opening both at once is a real short circuit (the discharge path
    // bypasses charge_resistance's current limiting) and severely sags
    // bus_voltage -- see Kicker::update in kicker.cpp. This is what real
    // firmware must avoid; the simulator does not prevent it, it simulates
    // the consequence.
    bool capacitor_charge_open = 8;
    bool kicker_open = 9;
}

message CommandResponse {
    bool success = 1;
    string message = 2;
}
